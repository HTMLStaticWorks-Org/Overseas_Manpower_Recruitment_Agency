<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | GlobeHire – Global Career Opportunities</title>
  <meta name="description" content="Create your GlobeHire candidate account to apply for verified overseas jobs across the GCC, Europe, and Asia-Pacific.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var saved = localStorage.getItem('globehire_theme');
      if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      if (localStorage.getItem('globehire_dir') === 'rtl') {
        document.documentElement.setAttribute('dir', 'rtl');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-navy-950 text-slate-800 dark:text-slate-100 font-sans antialiased relative flex items-center justify-center p-4 sm:p-6 overflow-x-hidden transition-colors duration-300">

  <!-- Subtle Animated Decorative Elements (No Distracting Background Image) -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="auth-orb absolute -top-24 -right-24 w-96 h-96 rounded-full bg-royal-500/15 dark:bg-royal-600/20 blur-3xl"></div>
    <div class="auth-orb absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-gold-500/15 dark:bg-gold-500/10 blur-3xl" style="animation-delay: -6s;"></div>
  </div>

  <!-- Top Utility Bar (RTL & Theme Toggles) -->
  <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-20 flex items-center gap-2.5">
    <button type="button" data-dir-toggle class="p-2.5 rounded-xl border border-slate-200 dark:border-white/15 bg-white/80 dark:bg-navy-900/80 backdrop-blur-md text-navy-900 dark:text-slate-200 hover:border-royal-500 dark:hover:border-gold-400 transition-all" aria-label="Switch to RTL layout" title="Toggle RTL / LTR">
      <svg class="dir-arrows-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16m0 0l-4-4m4 4l-4 4M20 16H4m0 0l4-4m-4 4l4 4"/></svg>
    </button>
    <button type="button" data-theme-toggle class="p-2.5 rounded-xl border border-slate-200 dark:border-white/15 bg-white/80 dark:bg-navy-900/80 backdrop-blur-md text-navy-900 dark:text-gold-400 hover:border-royal-500 dark:hover:border-gold-400 transition-all" aria-label="Toggle color theme">
      <svg class="icon-sun w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>
  </div>

  <!-- Centered Signup Card -->
  <main class="relative z-10 w-full max-w-md my-14">
    <div class="reveal-text rounded-3xl bg-white/95 dark:bg-navy-900/95 backdrop-blur-xl border border-slate-200 dark:border-white/10 shadow-premium p-7 sm:p-10">
      <!-- Centered Logo & Brand Name -->
      <div class="flex flex-col items-center text-center mb-7">
        <a href="index.html" class="inline-flex items-center justify-center gap-3 group">
          <img src="assets/images/logo-mark.svg" alt="GlobeHire Logo" class="w-11 h-11 transition-transform duration-300 group-hover:scale-105">
          <div class="text-start leading-tight">
            <span class="font-display text-2xl font-bold tracking-tight text-navy-900 dark:text-white">Globe<span class="text-royal-600 dark:text-gold-400">Hire</span></span>
            <span class="block text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Global Careers</span>
          </div>
        </a>
        <h1 class="mt-5 font-display text-xl font-bold text-navy-900 dark:text-white">Create Candidate Account</h1>
        <p class="mt-1 text-xs sm:text-sm text-slate-500 dark:text-slate-400">Start applying for verified global career opportunities</p>
      </div>

      <form id="signup-form" novalidate class="space-y-4">
        <div>
          <label for="signup-name" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Full Name *</label>
          <input id="signup-name" type="text" required placeholder="e.g. Arjun Mehta" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 text-sm text-navy-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-royal-500">
        </div>

        <div>
          <label for="signup-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Email Address *</label>
          <input id="signup-email" type="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 text-sm text-navy-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-royal-500">
        </div>

        <div>
          <label for="signup-phone" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Phone with Country Code *</label>
          <input id="signup-phone" type="tel" required placeholder="+971 50 000 0000" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 text-sm text-navy-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-royal-500">
        </div>

        <div>
          <label for="signup-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Password *</label>
          <div class="relative">
            <input id="signup-password" type="password" required placeholder="Min. 8 characters" class="w-full ps-4 pe-11 py-3 rounded-xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 text-sm text-navy-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-royal-500">
            <button type="button" data-toggle-password="signup-password" class="absolute end-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-navy-900 dark:hover:text-white transition-colors" aria-label="Show password">
              <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label for="signup-confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Confirm Password *</label>
          <div class="relative">
            <input id="signup-confirm-password" type="password" required placeholder="Re-enter password" class="w-full ps-4 pe-11 py-3 rounded-xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 text-sm text-navy-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-royal-500">
            <button type="button" data-toggle-password="signup-confirm-password" class="absolute end-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-navy-900 dark:hover:text-white transition-colors" aria-label="Show confirm password">
              <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>

        <label class="flex items-start gap-2.5 text-xs sm:text-sm text-slate-600 dark:text-slate-300 cursor-pointer pt-1">
          <input id="signup-terms" type="checkbox" required class="w-4 h-4 mt-0.5 rounded border-slate-300 text-royal-600 focus:ring-royal-500">
          <span>I agree to the <a href="process.html#compliance" class="font-semibold text-royal-600 dark:text-gold-400 hover:underline">Terms &amp; Conditions</a> and Privacy Policy.</span>
        </label>

        <div id="auth-feedback" class="hidden"></div>

        <button type="submit" class="btn-shimmer w-full py-3.5 rounded-xl bg-royal-600 hover:bg-royal-700 text-white font-bold text-sm shadow-sm hover:shadow-glow-purple transition-all">
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-white/10"></div></div>
        <div class="relative flex justify-center text-xs uppercase tracking-wider"><span class="px-3 bg-white dark:bg-navy-900 text-slate-400">Or sign up with</span></div>
      </div>

      <!-- Social Signup: Icon-Only Buttons (No Text Labels) -->
      <div class="flex items-center justify-center gap-4">
        <button type="button" data-social-auth="Google" aria-label="Sign up with Google" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 flex items-center justify-center hover:border-royal-500 dark:hover:border-gold-400 hover:-translate-y-1 hover:shadow-md transition-all duration-300">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
            <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.1-1.7.4-2.5L1.6 7C.6 8.9 0 11 0 13.3s.6 4.4 1.6 6.3l3.7-2.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5L1.6 17.2C3.5 21.1 7.4 24 12 24z"/>
          </svg>
        </button>

        <button type="button" data-social-auth="Facebook" aria-label="Sign up with Facebook" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 flex items-center justify-center hover:border-[#1877F2] hover:-translate-y-1 hover:shadow-md transition-all duration-300">
          <svg class="w-5 h-5 fill-[#1877F2]" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>
        </button>

        <button type="button" data-social-auth="Apple" aria-label="Sign up with Apple" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-navy-800 border border-slate-200 dark:border-white/15 text-navy-900 dark:text-white flex items-center justify-center hover:border-navy-900 dark:hover:border-white hover:-translate-y-1 hover:shadow-md transition-all duration-300">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        </button>
      </div>

      <p class="mt-7 text-center text-xs sm:text-sm text-slate-600 dark:text-slate-300">
        Already have an account? <a href="login.html" class="font-bold text-royal-600 dark:text-gold-400 hover:underline">Login</a>
      </p>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
